name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep the check name aligned with the protected main branch requirement.
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java for CSI247 examples
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Audit content architecture and learning data
        run: npm run audit:content:full && npm run test:csi247-markdown && npm run test:csi247-illustrations

      - name: Report how far each course is from the content standard
        # Report only: it prints the summary table and does not fail the build until the open orders are done.
        run: npm run audit:content-standard

      - name: Run unit tests
        run: npm run test:unit

      - name: Compile and run the Java examples in the CSI141 and CSI142 notes
        run: npm run verify:java-notes

      - name: Type check
        run: npm run types:check

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test CSI247 browser learning tools
        run: npm run test:browser
        env:
          PLAYWRIGHT_USE_BUILD: "1"
